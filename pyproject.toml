[project]
name = "tenty-parser"
dynamic = ["version"]
description = "Modern CLI tool to parse, transform and convert between JSON, YAML and TOON formats"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Custom License - See LICENSE file"}
authors = [
    {name = "Keniding", email = "kenidingh@gmail.com"}
]
keywords = ["parser", "json", "yaml", "toon", "cli", "converter", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
    "rich>=15.0.0",
    "toon-format>=0.9.0b1,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/Keniding/tenty-parser"
Repository = "https://github.com/Keniding/tenty-parser"
Issues = "https://github.com/Keniding/tenty-parser/issues"

[project.scripts]
tenty = "src.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
